name: Rebuild data JSON

on:
  push:
    paths:
      - "data/questions.csv"
      - "data/toppers.overrides.json"
      - "build.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js
      - name: Commit regenerated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/copies.json data/toppers.json
          git diff --cached --quiet || git commit -m "chore: rebuild data JSON [skip ci]"
          git push
