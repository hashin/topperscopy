name: OCR — Tesseract pass

# Free on public repos: standard GitHub-hosted runners have no minute cap.
# Sharded so each job stays well inside the 6-hour job limit.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: "How many parallel shards (1-20)"
        required: true
        default: "10"
      limit_per_shard:
        description: "Max units per shard (0 = no limit)"
        required: true
        default: "0"
      source:
        description: "Restrict to one source (blank = all). e.g. VisionIAS"
        required: false
        default: ""

permissions:
  contents: write
  actions: write        # to dispatch "Build & deploy" — a GITHUB_TOKEN push does NOT trigger it

concurrency:
  group: ocr-tesseract
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - id: mk
        env:
          SHARDS: ${{ github.event.inputs.shards }}
        run: |
          case "$SHARDS" in ''|*[!0-9]*) echo "shards must be a number, got '$SHARDS'"; exit 1;; esac
          [ "$SHARDS" -ge 1 ] && [ "$SHARDS" -le 20 ] || { echo "shards must be 1-20"; exit 1; }
          echo "matrix=$(python3 -c "import json,os;print(json.dumps(list(range(int(os.environ['SHARDS'])))))")" >> "$GITHUB_OUTPUT"

  ocr:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install poppler + tesseract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr

      - run: npm install --omit=dev --silent

      - name: Restore OCR cache
        uses: actions/cache/restore@v4
        with:
          path: .ocr
          key: ocr-cache-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            ocr-cache-${{ matrix.shard }}-
            ocr-cache-

      - name: Plan + free pass
        run: |
          node ocr-pipeline.mjs plan
          node ocr-pipeline.mjs freepass --concurrency 8

      - name: Tesseract OCR (shard ${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ github.event.inputs.shards }}
          LIMIT: ${{ github.event.inputs.limit_per_shard }}
          SOURCE: ${{ github.event.inputs.source }}
        run: |
          set -- ocr --chunk "$SHARD" --of "$SHARDS"
          [ "$LIMIT" != "0" ] && set -- "$@" --limit "$LIMIT"
          [ -n "$SOURCE" ] && set -- "$@" --source "$SOURCE"
          node ocr-pipeline.mjs "$@"

      - name: Save OCR cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ocr
          key: ocr-cache-${{ matrix.shard }}-${{ github.run_id }}

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-results-${{ matrix.shard }}
          path: .ocr/ocr/
          retention-days: 7
          if-no-files-found: warn

  merge:
    needs: ocr
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --omit=dev --silent

      - name: Collect every shard's results
        uses: actions/download-artifact@v4
        with:
          pattern: ocr-results-*
          merge-multiple: true
          path: .ocr/ocr

      - name: Validate, emit, rebuild
        run: |
          node ocr-pipeline.mjs plan
          node ocr-pipeline.mjs validate || true
          node ocr-pipeline.mjs emit
          node build.js

      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ocr-questions.csv
          if git diff --cached --quiet; then
            echo "no data change — nothing to deploy"; exit 0
          fi
          git commit -m "ocr: tesseract pass results"
          git pull --rebase --autostash
          git push
          gh workflow run "Build & deploy" --ref main
