name: OCR — Gemini vision pass

# PRIMARY OCR for the link-only booklets: renders the printed-question strip of
# every page and reads it with a rotation of gemini *-flash-lite models on the
# FREE tier. The daily 500-request cap is PER MODEL, so one booklet per model
# round-robin gives N×500/day at $0. Each model stops clean on its own per-day
# 429 and is dropped from the rotation. Progress is cached in .ocr/ so each run
# resumes where it stopped. Only *-flash-lite has the 500/day free quota
# (full/preview flash = 20/day, pro = 0), so the rotation is 3 flash-lite
# models → ~1,400 free req/night, backlog ~2 weeks, $0.
#
# Draining every model's quota, delay-proof — the per-day counter resets at
# midnight US-Pacific (07:00 UTC PDT / 08:00 UTC PST). A run drains whatever
# quota is available when it lands and stops only when EVERY model has 429'd
# (`gemini` keeps rotating until all are dead), and `.ocr` caches progress so a
# later run the same day picks up the rest. Three runs, 8 h apart, cover the
# whole 24 h with margin around the reset — GitHub would have to skip or delay
# all three out of one Pacific-day for a day's quota to be lost. The
# `concurrency` group serialises them; a run that lands while another is going
# just queues, then drains the residue and exits fast.
on:
  schedule:
    - cron: "20 8 * * *"        # 08:20 UTC — primary, right after the Pacific reset
    - cron: "40 16 * * *"       # 16:40 UTC — mid-day catch-up (delayed/short morning run)
    - cron: "0 1 * * *"         # 01:00 UTC — last drain before the next reset
  workflow_dispatch:
    inputs:
      requests:
        description: "Per-model request cap (paranoia limit; 550 lets the real per-day 429 stop each model)"
        required: true
        default: "550"
      models:
        description: "Comma-separated model rotation (each has its own 500/day)"
        required: true
        default: "gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.1-flash-lite-preview"
      redo:
        description: "Comma-separated booklet URLs to re-OCR (low-yield fixes; see `yield` report). Blank = normal run."
        required: false
        default: ""
      dpi:
        description: "Render DPI (blank = 150). Bump to ~220 for a redo run that needs a sharper header."
        required: false
        default: ""

permissions:
  contents: write
  actions: write        # to dispatch "Build & deploy" — a GITHUB_TOKEN push does NOT trigger it

concurrency:
  group: ocr-gemini
  cancel-in-progress: false

jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    if: ${{ vars.OCR_GEMINI_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }

      - name: Install poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - run: npm install --omit=dev --silent

      - name: Restore OCR cache
        uses: actions/cache/restore@v4
        with:
          path: .ocr
          key: ocr-gemini-${{ github.run_id }}
          restore-keys: |
            ocr-gemini-
            ocr-cache-

      # Durable backstop for the raw Gemini text + per-booklet records: the
      # Actions cache can be evicted (10 GB repo cap / a cache-service wipe / a
      # >7-day gap in runs). The `ocr-cache` branch is an orphan holding one
      # force-pushed tarball — no history growth on main. If the cache came back
      # without the raw text, rehydrate it from there so a re-OCR / salvage still
      # has something to work from.
      - name: Rehydrate raw-text cache
        run: |
          if [ ! -d .ocr/graw ] || [ -z "$(ls -A .ocr/graw 2>/dev/null)" ]; then
            if git fetch --depth=1 origin ocr-cache 2>/dev/null; then
              git show origin/ocr-cache:ocr-raw.tgz > /tmp/ocr-raw.tgz 2>/dev/null || true
              [ -s /tmp/ocr-raw.tgz ] && mkdir -p .ocr && tar xzf /tmp/ocr-raw.tgz -C .ocr && echo "rehydrated $(ls .ocr/graw | wc -l) raw pages from ocr-cache branch"
            fi
          fi

      - name: Gemini pass
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          REDO='${{ github.event.inputs.redo }}'
          [ -n "$REDO" ] && node ocr-pipeline.mjs redo --urls "$REDO"
          node ocr-pipeline.mjs plan
          node ocr-pipeline.mjs freepass --concurrency 8
          node ocr-pipeline.mjs gemini \
            --models "${{ github.event.inputs.models || 'gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.1-flash-lite-preview' }}" \
            --requests ${{ github.event.inputs.requests || '550' }} \
            ${{ github.event.inputs.dpi && format('--dpi {0}', github.event.inputs.dpi) || '' }}

      - name: Save OCR cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ocr
          key: ocr-gemini-${{ github.run_id }}

      - name: Validate, emit, commit, deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node ocr-pipeline.mjs validate || true
          node ocr-pipeline.mjs salvage --verbose || true
          node ocr-pipeline.mjs emit
          node ocr-pipeline.mjs yield || true
          cp -f .ocr/yield.json ocr-yield.json 2>/dev/null || true
          node build.js                       # sanity-check the build; output is regenerated by Build & deploy
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ocr-questions.csv data/optionals.json ocr-yield.json
          if git diff --cached --quiet; then
            echo "no data change — nothing to deploy"; exit 0
          fi
          git commit -m "ocr: gemini vision pass"
          git pull --rebase --autostash
          git push
          # a GITHUB_TOKEN push does not trigger other workflows, so kick the deploy explicitly
          gh workflow run "Build & deploy" --ref main

      # Push the raw text + per-booklet records to the orphan `ocr-cache` branch
      # (single force-pushed commit — no history growth). Deterministic tar so an
      # unchanged corpus produces an identical blob and git stores nothing new.
      - name: Persist raw-text cache
        if: always()
        run: |
          [ -d .ocr/graw ] || exit 0
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -cf - -C .ocr graw ocr | gzip -n > /tmp/ocr-raw.tgz
          echo "tarball: $(du -h /tmp/ocr-raw.tgz | cut -f1)"
          rm -rf /tmp/ocrcache && mkdir /tmp/ocrcache && cd /tmp/ocrcache
          git init -q && git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com"
          cp /tmp/ocr-raw.tgz ocr-raw.tgz
          printf '%s\n' "Raw Gemini OCR text + per-booklet records." "Orphan branch, one force-pushed commit. Rehydrated by ocr-gemini.yml on a cache miss." > README.md
          git add ocr-raw.tgz README.md
          git commit -q -m "ocr raw cache @ ${{ github.run_id }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ocr-cache
