name: OCR — Gemini vision pass

# PRIMARY OCR for the link-only booklets: renders the printed-question strip of
# every page and reads it with a rotation of gemini *-flash-lite models on the
# FREE tier. The daily 500-request cap is PER MODEL, so one booklet per model
# round-robin gives N×500/day at $0. Each model stops clean on its own per-day
# 429 and is dropped from the rotation. Progress is cached in .ocr/ so each run
# resumes where it stopped. Only *-flash-lite has the 500/day free quota
# (full/preview flash = 20/day, pro = 0), so the rotation is 3 flash-lite
# models → ~1,400 free req/night, backlog ~2 weeks, $0.
#
# Draining every model's quota, delay-proof — the per-day counter resets at
# midnight US-Pacific (07:00 UTC PDT / 08:00 UTC PST). A run drains whatever
# quota is available when it lands and stops only when EVERY model has 429'd
# (`gemini` keeps rotating until all are dead), and `.ocr` caches progress so a
# later run the same day picks up the rest. Three runs, 8 h apart, cover the
# whole 24 h with margin around the reset — GitHub would have to skip or delay
# all three out of one Pacific-day for a day's quota to be lost. The
# `concurrency` group serialises them; a run that lands while another is going
# just queues, then drains the residue and exits fast.
on:
  schedule:
    - cron: "20 8 * * *"        # 08:20 UTC — primary, right after the Pacific reset
    - cron: "40 16 * * *"       # 16:40 UTC — mid-day catch-up (delayed/short morning run)
    - cron: "0 1 * * *"         # 01:00 UTC — last drain before the next reset
  workflow_dispatch:
    inputs:
      requests:
        description: "Per-model request cap (paranoia limit; 550 lets the real per-day 429 stop each model)"
        required: true
        default: "550"
      models:
        description: "Comma-separated model rotation (each has its own 500/day)"
        required: true
        default: "gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.1-flash-lite-preview"

permissions:
  contents: write

concurrency:
  group: ocr-gemini
  cancel-in-progress: false

jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    if: ${{ vars.OCR_GEMINI_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - run: npm install --omit=dev --silent

      - name: Restore OCR cache
        uses: actions/cache/restore@v4
        with:
          path: .ocr
          key: ocr-gemini-${{ github.run_id }}
          restore-keys: |
            ocr-gemini-
            ocr-cache-

      - name: Gemini pass
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node ocr-pipeline.mjs plan
          node ocr-pipeline.mjs freepass --concurrency 8
          node ocr-pipeline.mjs gemini \
            --models "${{ github.event.inputs.models || 'gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.1-flash-lite-preview' }}" \
            --requests ${{ github.event.inputs.requests || '550' }}

      - name: Save OCR cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ocr
          key: ocr-gemini-${{ github.run_id }}

      - name: Validate, emit, rebuild, commit
        run: |
          node ocr-pipeline.mjs validate || true
          node ocr-pipeline.mjs salvage --verbose || true
          node ocr-pipeline.mjs emit
          node build.js
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ocr-questions.csv data/optionals.json
          git diff --cached --quiet || git commit -m "ocr: gemini vision pass"
          git pull --rebase --autostash || true
          git push
