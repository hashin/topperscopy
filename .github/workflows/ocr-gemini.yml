name: OCR — Gemini vision pass

# PRIMARY OCR for the link-only booklets: renders the printed-question strip of
# every page and reads it with gemini-3.5-flash-lite on the FREE tier. Runs
# nightly, stops at the request budget and on the first HTTP 429, so it never
# leaves the free quota. Progress is cached in .ocr/ so each run resumes where
# the last one stopped — expect the backlog to drain over ~4-6 weeks.
#
# 09:00 UTC: the Gemini free-tier request-per-day quota resets at midnight
# US-Pacific (~08:00 UTC). Running just after that — and letting GitHub's
# scheduler delay push it later, never earlier — gives each run a full fresh
# day's quota and avoids colliding with the previous day's run.
on:
  schedule:
    - cron: "0 9 * * *"         # 09:00 UTC daily (just after the Pacific quota reset)
  workflow_dispatch:
    inputs:
      requests:
        description: "Max Gemini requests this run (gemini-3.5-flash-lite free tier = 500/day, verified; 6 pages per request)"
        required: true
        default: "550"

permissions:
  contents: write

concurrency:
  group: ocr-gemini
  cancel-in-progress: false

jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    if: ${{ vars.OCR_GEMINI_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - run: npm install --omit=dev --silent

      - name: Restore OCR cache
        uses: actions/cache/restore@v4
        with:
          path: .ocr
          key: ocr-gemini-${{ github.run_id }}
          restore-keys: |
            ocr-gemini-
            ocr-cache-

      - name: Gemini pass
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node ocr-pipeline.mjs plan
          node ocr-pipeline.mjs freepass --concurrency 8
          node ocr-pipeline.mjs gemini --requests ${{ github.event.inputs.requests || '550' }}

      - name: Save OCR cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ocr
          key: ocr-gemini-${{ github.run_id }}

      - name: Validate, emit, rebuild, commit
        run: |
          node ocr-pipeline.mjs validate || true
          node ocr-pipeline.mjs salvage --verbose || true
          node ocr-pipeline.mjs emit
          node build.js
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ocr-questions.csv data/optionals.json
          git diff --cached --quiet || git commit -m "ocr: gemini vision pass"
          git pull --rebase --autostash || true
          git push
