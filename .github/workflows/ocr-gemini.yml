name: OCR — Gemini vision pass

# PRIMARY OCR for the link-only booklets: renders the printed-question strip of
# every page and reads it with a rotation of gemini *-flash-lite models on the
# FREE tier. The daily 500-request cap is PER MODEL, so one booklet per model
# round-robin gives N×500/day at $0. Each model stops clean on its own per-day
# 429 and is dropped from the rotation. Progress is cached in .ocr/ so each run
# resumes where it stopped. With 2 models the backlog drains in ~3 weeks.
#
# Quota timing — the free-tier requests-per-day counter resets at midnight
# US-Pacific: 07:00 UTC under PDT (Mar-Nov), 08:00 UTC under PST (Nov-Mar). A
# run must START after that boundary to get a full fresh 500; GitHub only ever
# delays a scheduled run, never fires it early. So:
#   * 08:30 UTC primary — 30 min past the PST reset, 90 min past PDT. A GitHub
#     delay of up to ~15 h still lands inside the same quota-day.
#   * 16:30 UTC backup — catches the (rare) morning cron that GitHub skips
#     entirely; same quota-day, so it only ever uses quota the morning run
#     left on the table. If the morning run already spent all 500 it 429s on
#     request 1 and exits clean.
# The `concurrency` group below means the two never overlap.
on:
  schedule:
    - cron: "30 8 * * *"        # 08:30 UTC — primary, just after the US-Pacific quota reset
    - cron: "30 16 * * *"       # 16:30 UTC — backup for a skipped morning run, same quota-day
  workflow_dispatch:
    inputs:
      requests:
        description: "Per-model request cap (free tier = 500/day PER MODEL; rotation below multiplies it)"
        required: true
        default: "480"
      models:
        description: "Comma-separated model rotation (one model per booklet)"
        required: true
        default: "gemini-3.5-flash-lite,gemini-3.1-flash-lite"

permissions:
  contents: write

concurrency:
  group: ocr-gemini
  cancel-in-progress: false

jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    if: ${{ vars.OCR_GEMINI_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - run: npm install --omit=dev --silent

      - name: Restore OCR cache
        uses: actions/cache/restore@v4
        with:
          path: .ocr
          key: ocr-gemini-${{ github.run_id }}
          restore-keys: |
            ocr-gemini-
            ocr-cache-

      - name: Gemini pass
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node ocr-pipeline.mjs plan
          node ocr-pipeline.mjs freepass --concurrency 8
          node ocr-pipeline.mjs gemini \
            --models "${{ github.event.inputs.models || 'gemini-3.5-flash-lite,gemini-3.1-flash-lite' }}" \
            --requests ${{ github.event.inputs.requests || '480' }}

      - name: Save OCR cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ocr
          key: ocr-gemini-${{ github.run_id }}

      - name: Validate, emit, rebuild, commit
        run: |
          node ocr-pipeline.mjs validate || true
          node ocr-pipeline.mjs salvage --verbose || true
          node ocr-pipeline.mjs emit
          node build.js
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ocr-questions.csv data/optionals.json
          git diff --cached --quiet || git commit -m "ocr: gemini vision pass"
          git pull --rebase --autostash || true
          git push
