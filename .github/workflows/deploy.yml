name: Build & deploy

# Builds data/*.json, toppers.html, the per-topper/question/paper/optional static
# pages, sitemaps, dataset/ backup — fresh, every time — and deploys the result to
# GitHub Pages. None of that generated output is committed to the repo (see
# .gitignore + CLAUDE.md): this workflow is the only place it's produced. Runs on
# every push to main, so a moderator approval (moderate.yml) or an OCR pass
# (ocr.yml / ocr-gemini.yml) — both of which now only commit *source* files —
# goes live automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build (node build.js — zero runtime deps)
        run: node build.js

      - name: Stage the servable site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='node_modules' --exclude='.ocr' \
            --exclude='*.md' --exclude='package.json' --exclude='package-lock.json' \
            --exclude='/build.js' --exclude='/extract.js' --exclude='/ocr-pipeline.mjs' \
            --exclude='/setup-ocr-vm.sh' --exclude='.gitignore' --exclude='.gitattributes' \
            ./ _site/
          echo "staged $(du -sh _site | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
